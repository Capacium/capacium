name: Bump Homebrew Tap

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  bump:
    # Hybrid mirror: this GitHub-only release pipeline is skipped on the
    # self-hosted Forgejo (no macOS/Windows runners). Runs on GitHub only.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Fetch source tarball and compute SHA256
        id: hash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -sSL "$URL" -o capacium.tar.gz
          SHA=$(sha256sum capacium.tar.gz | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify tap token before checkout
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # A GET against the GitHub API is the lightest proof the token is still
          # valid AND scoped to the tap. `actions/checkout` only reports a
          # cryptic auth failure at 'Checkout tap'; this step turns an
          # expired/revoked token into an explicit, named failure so the operator
          # sees "token expired" and not a generic checkout error.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" \
            "https://api.github.com/repos/Capacium/homebrew-tap")
          if [ "$status" != "200" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is expired or revoked (GET Capacium/homebrew-tap returned HTTP ${status})."
            echo "  The tap will NOT be updated and the release notes will flag Homebrew as stale."
            exit 1
          fi
          echo "HOMEBREW_TAP_TOKEN is valid (HTTP ${status})."

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: Capacium/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          FILE="tap/Formula/capacium.rb"
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("$FILE")
          s = p.read_text()
          s = re.sub(r'url "[^"]+"', 'url "${{ steps.hash.outputs.url }}"', s, count=1)
          s = re.sub(r'sha256 "[a-f0-9]+"', 'sha256 "${{ steps.hash.outputs.sha }}"', s, count=1)
          p.write_text(s)
          PY
          cd tap
          git diff --stat

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/capacium.rb
          if git diff --cached --quiet; then
            echo "No changes — formula already up to date."
            exit 0
          fi
          git commit -m "capacium: update to ${{ steps.tag.outputs.tag }}"
          git push
