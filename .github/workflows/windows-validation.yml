name: Windows Validation

# ══════════════════════════════════════════════════════════════════════════
# GitHub-only, manually dispatched pre-tag gate for the Windows leg.
#
# The full release gate (release.yml) runs a 3x3 matrix on GitHub including
# windows-latest, but it only triggers on a pushed `v*.*.*` tag — by then the
# tag already exists and mirror/publish may be racing. This workflow lets a
# maintainer run the *actual* release test command on the candidate branch
# BEFORE tagging, on Windows alone.
#
# It NEVER publishes, tags, or creates a release: it only lints and runs the
# release-equivalent pytest command. Forgejo remains canonical; this is a
# manual mirror-side convenience.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # Windows console defaults to cp1252 (charmap crashes on unicode output)

jobs:
  validate:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        shell: bash  # Windows defaults to pwsh, which cannot parse \ line continuations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml cryptography pytest pytest-cov ruff build
          # Pin to the immutable candidate-compatible release tag, not the
          # moving default branch: the 1.1.1 candidate builds against
          # capacium-models v1.1.0, and a later main could drift the contract.
          pip install "capacium-models @ git+https://github.com/Capacium/capacium-models.git@v1.1.0"
          pip install -e ".[trust]"

      - name: Lint
        run: python -m ruff check .

      - name: Test (release command)
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_signing.py \
            --ignore=tests/test_integration_phase0.py
