name: Pre-Release Validation

# Pre-flight gates for a release candidate. This workflow validates the
# candidate (lint, tests, version and README consistency) and publishes
# nothing: the release object and the tag belong to the ops-engine layover on
# Forgejo, and RC tags are not mirrored to GitHub.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.4.0) — the candidate is validated as v{version}"
        required: true
        type: string

jobs:
  prerelease:
    # Hybrid mirror: this GitHub-only pre-flight is skipped on the
    # self-hosted Forgejo. Runs on GitHub only.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml cryptography pytest pytest-cov ruff
          pip install -e ".[trust]"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short --cov=src/capacium

      - name: Validate pyproject.toml version
        run: |
          VERSION="${{ inputs.version }}"
          PYPROJ_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if [ "$PYPROJ_VERSION" != "$VERSION" ]; then
            echo "ERROR: pyproject.toml version is ${PYPROJ_VERSION}, but release version is ${VERSION}. Bump pyproject.toml first, then retry."
            echo "  Run: sed -i '' 's/version = \"${PYPROJ_VERSION}\"/version = \"${VERSION}\"/' pyproject.toml"
            exit 1
          fi
          echo "pyproject.toml version matches v${VERSION}."

      - name: Validate README version references
        run: |
          VERSION="${{ inputs.version }}"
          if ! grep -q "@v${VERSION}" README.md; then
            echo "ERROR: README.md references are not updated to v${VERSION}. Please update all install examples before cutting a release."
            echo "  Run: sed -i 's/@v[0-9.]*/@v${VERSION}/g' README.md"
            echo "  Run: sed -i 's|ghcr.io/capacium/cap:[0-9.]*|ghcr.io/capacium/cap:${VERSION}|g' README.md"
            exit 1
          fi
          echo "README version references match v${VERSION}."

      # No tag is created and no release object is written here. The
      # ops-engine lays the release down on Forgejo at tag_push; a GitHub-side
      # RC tag and pre-release would be a second writer of the same surface.
