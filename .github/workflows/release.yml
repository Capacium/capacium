name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # Windows console defaults to cp1252 (charmap crashes on unicode output)

jobs:
  # ═══════════════════════════════════════════
  # Stage 1: Build & Test — quality gate, NOT a distribution dependency
  # ═══════════════════════════════════════════
  #
  # ADR 2026-08-13-release-distribution-boundary: this 3x3 matrix is a gate on
  # the ref, not a `needs:` input to the distribution steps. The asset attach
  # and winget jobs depend on `attach-assets` below succeeding, not on the full
  # matrix, so a Windows test failure no longer silently skips Linux and macOS
  # distribution (CAP-CI-003).
  build:
    # Hybrid mirror: this GitHub-only release pipeline is skipped on the
    # self-hosted Forgejo (no macOS/Windows runners). Runs on GitHub only.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        shell: bash  # Windows defaults to pwsh, which cannot parse \ line continuations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml cryptography pytest pytest-cov ruff build "setuptools>=70.1"
          pip install git+https://github.com/Capacium/capacium-models.git
          pip install -e ".[trust]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_signing.py \
            --ignore=tests/test_integration_phase0.py

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  # ═══════════════════════════════════════════
  # Stage 2: Attach distribution assets
  # ═══════════════════════════════════════════
  #
  # The release OBJECT — title and notes — is owned by the ops-engine layover
  # running on Forgejo (lvc-ops docs/release-flow-division.md). A per-repo
  # workflow that creates, edits or deletes that object is the defect, not the
  # rule: an object built here would race the engine's and, with different
  # notes, make the engine mark the destination failed.
  #
  # This job therefore only ATTACHES the artefacts the Forgejo host cannot
  # build, and it fails closed: if no release object exists for the tag yet the
  # attach step raises AttachError and uploads nothing, and an asset that is
  # already on the release is left untouched rather than overwritten.
  #
  # Standalone binaries + deb/rpm are produced by binaries.yml (single owner);
  # they are NOT built here.
  attach-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/ 2>/dev/null || true
          cd release-assets
          sha256sum -- *.whl *.tar.gz 2>/dev/null > checksums.txt || true
          cat checksums.txt
          # Absolute paths: the attach step runs from the workspace root.
          printf '%s\n' "$PWD"/* | tee "$GITHUB_WORKSPACE/release-assets.txt"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential. Pinned to the v3.4.2 tag. The
      # checker is the same one the Forgejo release job fetches, so the two
      # forges enforce the identical audience gate rather than two copies.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/release_notes_audience_gate.py" \
            -o "$RUNNER_TEMP/release_notes_audience_gate.py"
          # Prove what arrived (a redirect to a login page returns 200 and
          # curl -f never triggers, so without this the failure would surface
          # later as a SyntaxError on "<!DOCTYPE html>").
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/release_notes_audience_gate.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/release_notes_audience_gate.py"; exit 1; }

      # The notes for this tag are the CHANGELOG entry, never a commit-log
      # dump. This workflow no longer writes them anywhere — the release
      # object and its notes belong to the engine — but it still refuses to
      # attach artefacts for a tag whose notes would have been rejected: a
      # missing or empty section fails here, and an entry naming this
      # repository's tracker fails the same audience gate the Forgejo job
      # enforces. The extractor and prefix parser are the committed
      # implementations, so the two forges cannot disagree about what is
      # acceptable for vX.Y.Z.
      - name: Gate the changelog entry for this tag
        id: changelog_gate
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          python3 scripts/extract_changelog_notes.py "$TAG" > "$NOTES_FILE"
          python3 scripts/extract_tracker_prefixes.py > "$PREFIXES_FILE"
          python3 "$RUNNER_TEMP/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

          echo "changelog entry for ${TAG} passed the audience gate"

      - name: Check release body contains the CHANGELOG section
        id: body_check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_API_BASE: ${{ vars.RELEASE_API_BASE || 'https://api.github.com' }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          # Fetch the release JSON from the GitHub API (or configured base).
          RELEASE_JSON=$(mktemp)
          trap 'rm -f "$RELEASE_JSON"' EXIT
          python3 -c "
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          token = os.environ.get('GH_TOKEN') or os.environ.get('GITHUB_TOKEN')
          if not token:
              print('AttachError: GH_TOKEN is not set; cannot read the release', file=sys.stderr)
              sys.exit(2)

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          tag = os.environ.get('RELEASE_TAG', '')
          if not repo or not tag:
              print('AttachError: GITHUB_REPOSITORY and RELEASE_TAG must both be set', file=sys.stderr)
              sys.exit(2)

          api = (os.environ.get('RELEASE_API_BASE') or 'https://api.github.com').rstrip('/')
          url = f'{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag)}'
          req = urllib.request.Request(url)
          req.add_header('Authorization', 'Bearer ' + token)
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  release = json.loads(resp.read().decode())
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  release = {'message': 'Not Found'}
              else:
                  print(f'AttachError: could not read the release for tag {tag}: HTTP {exc.code}', file=sys.stderr)
                  sys.exit(2)

          json.dump(release, sys.stdout)
          " > "$RELEASE_JSON"

          # Gate: the body must contain the CHANGELOG section for this tag.
          python3 scripts/check_release_body.py "$TAG" --release-json "$RELEASE_JSON"

      - name: Attach assets to the engine-created release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS_FILE: ${{ github.workspace }}/release-assets.txt
        run: |
          set -euo pipefail
          python3 - <<'PYATTACH'
          """Attach build artefacts to an existing GitHub release.

          The release object is created by the ops-engine layover on Forgejo;
          this script must never create, edit or delete it. It resolves the
          release for the tag, uploads only the assets that are not already
          attached, and fails closed with AttachError when no release exists.
          """

          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path


          class AttachError(Exception):
              """A precondition for attaching failed; nothing was uploaded."""


          def _token() -> str:
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise AttachError("GH_TOKEN is not set; cannot read or write releases")
              return token


          def _base(name: str, default: str) -> str:
              return (os.environ.get(name) or default).rstrip("/")


          def _request(url: str, token: str, *, method: str = "GET",
                       data: bytes | None = None,
                       content_type: str = "application/vnd.github+json"):
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", content_type)
              return urllib.request.urlopen(req, timeout=60)


          def _release_for_tag(api: str, repo: str, tag: str, token: str) -> dict:
              url = f"{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag)}"
              try:
                  with _request(url, token) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      raise AttachError(
                          f"no release object exists for tag {tag}; the ops-engine "
                          "layover creates it before this step may attach"
                      ) from None
                  raise AttachError(
                      f"could not read the release for tag {tag}: HTTP {exc.code}"
                  ) from None


          def _asset_paths() -> list[Path]:
              manifest = os.environ.get("RELEASE_ASSETS_FILE")
              if not manifest:
                  raise AttachError("RELEASE_ASSETS_FILE is not set")
              listing = Path(manifest)
              if not listing.is_file():
                  raise AttachError(f"asset manifest not found: {listing}")
              paths = [
                  Path(line.strip())
                  for line in listing.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
              if not paths:
                  raise AttachError("the asset manifest is empty; nothing to attach")
              missing = [str(p) for p in paths if not p.is_file()]
              if missing:
                  raise AttachError("asset file(s) missing: " + ", ".join(missing))
              return paths


          def _upload(upload: str, repo: str, release_id: int, path: Path,
                      token: str) -> None:
              query = urllib.parse.urlencode({"name": path.name})
              url = f"{upload}/repos/{repo}/releases/{release_id}/assets?{query}"
              payload = path.read_bytes()
              with _request(url, token, method="POST", data=payload,
                            content_type="application/octet-stream") as response:
                  if response.status not in (200, 201):
                      raise AttachError(
                          f"upload of {path.name} returned HTTP {response.status}"
                      )


          def main() -> int:
              try:
                  token = _token()
                  api = _base("RELEASE_API_BASE", "https://api.github.com")
                  upload = _base("RELEASE_UPLOAD_BASE", "https://uploads.github.com")
                  repo = os.environ.get("GITHUB_REPOSITORY")
                  tag = os.environ.get("RELEASE_TAG")
                  if not repo or not tag:
                      raise AttachError(
                          "GITHUB_REPOSITORY and RELEASE_TAG must both be set"
                      )

                  paths = _asset_paths()
                  release = _release_for_tag(api, repo, tag, token)
                  release_id = release.get("id")
                  if not isinstance(release_id, int):
                      raise AttachError(
                          f"release for tag {tag} has no numeric id; refusing to guess"
                      )

                  attached = {
                      asset.get("name") for asset in release.get("assets", [])
                  }
                  for path in paths:
                      if path.name in attached:
                          print(f"{path.name}: already attached, left untouched")
                          continue
                      _upload(upload, repo, release_id, path, token)
                      print(f"{path.name}: attached")
              except AttachError as exc:
                  print(f"AttachError: {exc}", file=sys.stderr)
                  return 2
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYATTACH

  # ═══════════════════════════════════════════
  # Stage 3: Verify distribution channels published this tag
  # ═══════════════════════════════════════════
  #
  # CAP-OPS-A7: on v0.18.0 the Homebrew tap bump failed on an expired
  # HOMEBREW_TAP_TOKEN and NOTHING reported it — PyPI, Docker and the binaries
  # published while the tap silently stayed at v0.17.1. A `brew upgrade` handed
  # out the previous version with no signal anywhere. Each distribution channel
  # is a separate workflow (bump-tap.yml, publish.yml, docker.yml, binaries.yml)
  # and Forgejo/GitHub has no cross-workflow `needs:`, so a lone red row in the
  # workflow list was invisible to whoever judged the release. This job re-reads
  # each channel's live public state after the attach step and fails if any
  # channel did not publish the release tag.
  #
  # It is READ-ONLY with respect to the release object: the table goes to the
  # job log and the step summary, never into the release body. Writing it into
  # the body would edit an object the engine owns and make the engine mark the
  # destination failed.
  verify-channels:
    needs: attach-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify every distribution channel published this tag
        id: channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # ADR 2026-08-13 (decision 3): the Docker image tag is the numeric
          # version WITHOUT a leading `v` (docker.yml `type=semver`), matching
          # the README, validate-release-tag.yml, and ci.yml. The PyPI and
          # Homebrew identifiers also omit the `v`.
          DOCKER_TAG="${VERSION}"
          TAP_NEEDLE="refs/tags/${TAG}.tar.gz"
          API="https://api.github.com/repos/${{ github.repository }}"

          pass="## Distribution channels\n\n| Channel | Published | Version |\n|---|---|---|\n"
          failed=0

          # --- PyPI ---
          pypi_ver=$(curl -sSf "https://pypi.org/pypi/capacium/json" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])')
          if [ "${pypi_ver}" = "${VERSION}" ]; then
            pass="${pass}| PyPI | :white_check_mark: | ${pypi_ver} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| PyPI | :x: | ${pypi_ver} (expected ${VERSION}) |\n"
          fi

          # --- Docker (GHCR) ---
          # Uses the anonymous pull token, not secrets.GITHUB_TOKEN, so a public
          # image verifies without auth (matches a real `docker pull`).
          tkn=$(curl -sSf "https://ghcr.io/token?scope=repository:capacium/cap:pull" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          docker_code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${tkn}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/capacium/cap/manifests/${DOCKER_TAG}")
          if [ "${docker_code}" = "200" ]; then
            pass="${pass}| Docker (GHCR) | :white_check_mark: | ${DOCKER_TAG} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Docker (GHCR) | :x: | no manifest for ${DOCKER_TAG} (HTTP ${docker_code}) |\n"
          fi

          # --- Homebrew tap ---
          tap_url="https://raw.githubusercontent.com/Capacium/homebrew-tap/main/Formula/capacium.rb"
          if tap_body=$(curl -sSf "${tap_url}" 2>/dev/null) && echo "${tap_body}" | grep -qF "${TAP_NEEDLE}"; then
            pass="${pass}| Homebrew tap | :white_check_mark: | ${TAG} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Homebrew tap | :x: | formula does not reference ${TAP_NEEDLE} |\n"
          fi

          # --- Standalone binaries (release assets) ---
          asset_count=$(curl -sSf "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("assets",[])))' 2>/dev/null || echo 0)
          if [ "${asset_count}" -gt 0 ]; then
            pass="${pass}| Standalone binaries | :white_check_mark: | ${asset_count} assets attached |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Standalone binaries | :x: | 0 assets attached |\n"
          fi

          # --- winget ---
          pass="${pass}| winget | :grey_question: | manual (see update-winget) |\n"

          echo "----- channel report -----"
          printf '%b' "${pass}"
          printf '%b' "${pass}" >> "${GITHUB_STEP_SUMMARY}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} distribution channel(s) did not publish ${TAG} — see the Distribution channels table in this job's summary."
            exit 1
          fi

  # ═══════════════════════════════════════════
  # Stage 4: winget — the single owner, no duplicate workflow
  # ═══════════════════════════════════════════
  #
  # winget has no standalone workflow, so this job remains here. It runs after
  # attach-assets (NOT after the full build matrix — a red Windows check must
  # not skip it silently). The four distribution steps that PyPI/docker/
  # binaries/bump-tap own were removed from this workflow to kill the
  # duplication (CAP-CI-003).
  update-winget:
    needs: attach-assets
    runs-on: ubuntu-latest

    steps:
      - name: Generate Winget manifest
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Winget manifest update for Capacium v${VERSION}"
          echo ""
          echo "To publish to winget-pkgs, create a PR at:"
          echo "  https://github.com/microsoft/winget-pkgs"
          echo ""
          echo "Manifest path:"
          echo "  manifests/c/Capacium/Capacium/${VERSION}/"
          echo ""
          echo "Run locally with the wingetcreate tool:"
          echo "  wingetcreate update Capacium.Capacium -v ${VERSION} -u https://github.com/Capacium/capacium/releases/download/${TAG}/cap-Windows-X64.zip"

      - name: Dispatch Winget manifest PR trigger
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Automated Winget PR creation not yet configured."
          echo "Manual steps for v${VERSION} documented above."
