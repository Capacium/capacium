name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # Windows console defaults to cp1252 (charmap crashes on unicode output)

jobs:
  # ═══════════════════════════════════════════
  # Stage 1: Build & Test — quality gate, NOT a distribution dependency
  # ═══════════════════════════════════════════
  #
  # ADR 2026-08-13-release-distribution-boundary: this 3x3 matrix is a gate on
  # the ref, not a `needs:` input to the distribution steps. The GH Release and
  # winget depend on `build-binaries`/`create-release` below succeeding, not on
  # the full matrix, so a Windows test failure no longer silently skips Linux
  # and macOS distribution (CAP-CI-003).
  build:
    # Hybrid mirror: this GitHub-only release pipeline is skipped on the
    # self-hosted Forgejo (no macOS/Windows runners). Runs on GitHub only.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        shell: bash  # Windows defaults to pwsh, which cannot parse \ line continuations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml cryptography pytest pytest-cov ruff build
          pip install git+https://github.com/Capacium/capacium-models.git
          pip install -e ".[trust]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_signing.py \
            --ignore=tests/test_integration_phase0.py

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  # ═══════════════════════════════════════════
  # Stage 2: Create GitHub Release
  # ═══════════════════════════════════════════
  #
  # Standalone binaries + deb/rpm are produced by binaries.yml (single owner);
  # they are NOT built here. This job only assembles the GH Release object from
  # artifacts binaries.yml already attached and the dist/ wheels built above.
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/ 2>/dev/null || true
          cd release-assets
          sha256sum -- *.whl *.tar.gz 2>/dev/null > checksums.txt || true
          cat checksums.txt

      # The body is the CHANGELOG entry for this tag, never a commit-log dump.
      # A tag whose version has no section — or an empty one — fails here,
      # before the GitHub Release object is created. The extractor is the same
      # committed implementation the Forgejo job uses, so the two forges cannot
      # disagree on what the notes for vX.Y.Z are.
      - name: Generate release notes
        id: release_notes
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          NOTES="$(python3 scripts/extract_changelog_notes.py "$TAG")"

          {
            cat <<EOF
          ## Capacium ${TAG}

          ${NOTES}

          ### Install

          **Homebrew**
          \`\`\`bash
          brew update && brew upgrade capacium
          cap -v  # → ${VERSION}
          \`\`\`

          **pip**
          \`\`\`bash
          pip install capacium==${VERSION}
          \`\`\`

          **Docker**
          \`\`\`bash
          docker pull ghcr.io/capacium/cap:${VERSION}
          \`\`\`

          **Standalone binaries** — attached below for macOS, Linux, and Windows.

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md) for details.
          EOF
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Capacium ${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: false
          files: release-assets/*

      - name: Verify release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="Capacium ${TAG}"
          ACTUAL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json name --jq '.name' 2>/dev/null || echo "")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Fixing release title: expected '${EXPECTED}', got '${ACTUAL}'"
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$EXPECTED"
          fi
          echo "Release title: ${EXPECTED}"

  # ═══════════════════════════════════════════
  # Stage 3: Verify distribution channels surface in the release itself
  # ═══════════════════════════════════════════
  #
  # CAP-OPS-A7: on v0.18.0 the Homebrew tap bump failed on an expired
  # HOMEBREW_TAP_TOKEN and NOTHING reported it — PyPI, Docker and the binaries
  # published while the tap silently stayed at v0.17.1. A `brew upgrade` handed
  # out the previous version with no signal anywhere. Each distribution channel
  # is a separate workflow (bump-tap.yml, publish.yml, docker.yml, binaries.yml)
  # and Forgejo/GitHub has no cross-workflow `needs:`, so a lone red row in the
  # workflow list was invisible to whoever judged the release. This job runs
  # after create-release, re-reads each channel's live public state, and writes a
  # "Distribution channels" table INTO the release body — the one place a release
  # reader looks — then fails the job if any channel did not actually publish the
  # release tag. The failure surfaces here AND in the release body, not merely as
  # one more red workflow row.
  verify-channels:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify every distribution channel published this tag
        id: channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # ADR 2026-08-13 (decision 3): the Docker image tag is the numeric
          # version WITHOUT a leading `v` (docker.yml `type=semver`), matching
          # the README, validate-release-tag.yml, and ci.yml. The PyPI and
          # Homebrew identifiers also omit the `v`.
          DOCKER_TAG="${VERSION}"
          TAP_NEEDLE="refs/tags/${TAG}.tar.gz"
          API="https://api.github.com/repos/${{ github.repository }}"

          pass="## Distribution channels\n\n| Channel | Published | Version |\n|---|---|---|\n"
          failed=0

          # --- PyPI ---
          pypi_ver=$(curl -sSf "https://pypi.org/pypi/capacium/json" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])')
          if [ "${pypi_ver}" = "${VERSION}" ]; then
            pass="${pass}| PyPI | :white_check_mark: | ${pypi_ver} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| PyPI | :x: | ${pypi_ver} (expected ${VERSION}) |\n"
          fi

          # --- Docker (GHCR) ---
          # Uses the anonymous pull token, not secrets.GITHUB_TOKEN, so a public
          # image verifies without auth (matches a real `docker pull`).
          tkn=$(curl -sSf "https://ghcr.io/token?scope=repository:capacium/cap:pull" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          docker_code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${tkn}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/capacium/cap/manifests/${DOCKER_TAG}")
          if [ "${docker_code}" = "200" ]; then
            pass="${pass}| Docker (GHCR) | :white_check_mark: | ${DOCKER_TAG} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Docker (GHCR) | :x: | no manifest for ${DOCKER_TAG} (HTTP ${docker_code}) |\n"
          fi

          # --- Homebrew tap ---
          tap_url="https://raw.githubusercontent.com/Capacium/homebrew-tap/main/Formula/capacium.rb"
          if tap_body=$(curl -sSf "${tap_url}" 2>/dev/null) && echo "${tap_body}" | grep -qF "${TAP_NEEDLE}"; then
            pass="${pass}| Homebrew tap | :white_check_mark: | ${TAG} |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Homebrew tap | :x: | formula does not reference ${TAP_NEEDLE} |\n"
          fi

          # --- Standalone binaries (release assets) ---
          asset_count=$(curl -sSf "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("assets",[])))' 2>/dev/null || echo 0)
          if [ "${asset_count}" -gt 0 ]; then
            pass="${pass}| Standalone binaries | :white_check_mark: | ${asset_count} assets attached |\n"
          else
            failed=$((failed + 1))
            pass="${pass}| Standalone binaries | :x: | 0 assets attached |\n"
          fi

          # --- winget ---
          pass="${pass}| winget | :grey_question: | manual (see update-winget) |\n"

          # Surface: append the table to the release body regardless of outcome,
          # so a stale channel is visible where the release is judged.
          OLD_BODY=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json body --jq '.body // ""' 2>/dev/null || echo "")
          printf -v BODY '%b' "${OLD_BODY}\n\n${pass}\n"
          gh release edit "${TAG}" --repo "${{ github.repository }}" --notes "${BODY}" >/dev/null

          echo "----- channel report -----"
          printf '%b' "${pass}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"
          echo "::group::channel-report"
          printf '%b' "${pass}"
          echo "::endgroup::"

          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} distribution channel(s) did not publish ${TAG} — see the Distribution channels table on the release."
            exit 1
          fi

  # ═══════════════════════════════════════════
  # Stage 4: winget — the single owner, no duplicate workflow
  # ═══════════════════════════════════════════
  #
  # winget has no standalone workflow, so this job remains here. It runs after
  # create-release (NOT after the full build matrix — a red Windows check must
  # not skip it silently). The four distribution steps that PyPI/docker/binaries/
  # bump-tap own were removed from this workflow to kill the duplication
  # (CAP-CI-003).
  update-winget:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Generate Winget manifest
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Winget manifest update for Capacium v${VERSION}"
          echo ""
          echo "To publish to winget-pkgs, create a PR at:"
          echo "  https://github.com/microsoft/winget-pkgs"
          echo ""
          echo "Manifest path:"
          echo "  manifests/c/Capacium/Capacium/${VERSION}/"
          echo ""
          echo "Run locally with the wingetcreate tool:"
          echo "  wingetcreate update Capacium.Capacium -v ${VERSION} -u https://github.com/Capacium/capacium/releases/download/${TAG}/cap-Windows-X64.zip"

      - name: Dispatch Winget manifest PR trigger
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Automated Winget PR creation not yet configured."
          echo "Manual steps for v${VERSION} documented above."
