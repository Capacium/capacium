name: Create Forgejo Release

# The release body is the CHANGELOG entry for the tag being released, never a
# commit-log dump. This workflow:
#
#   1. gates the release title (exactly "Capacium vX.Y.Z"),
#   2. extracts the notes from that tag's CHANGELOG.md section, and refuses the
#      release before any release object exists if the section is missing or
#      empty — a release with no authored notes is a release nobody can read,
#   3. runs the ops-engine external-audience gate, so a body that still names
#      this repository's own tracker is refused before publication,
#   4. creates the release with the canonical title and the extracted notes, or
#      — when it already exists — PATCHes BOTH the title and the body, so the
#      idempotent path cannot repair a title while leaving a stale body.
#
# The extraction is one implementation shared with the GitHub release job
# (scripts/extract_changelog_notes.py), not a second, drifting copy.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # The release title is a gate, not an agreement. A tag whose rendered
      # title does not conform is refused here, before any release object
      # exists. Forge default behaviour names a release after the bare tag —
      # that is not the convention.
      - name: Gate the release title
        id: title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          RELEASE_NAME="Capacium ${TAG_NAME}"
          python3 - "${RELEASE_NAME}" <<'TITLE_GATE_PY'
          import re
          import sys

          NAME_RE = re.compile(
              r"^Capacium v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?$"
          )
          name = sys.argv[1]
          if not NAME_RE.match(name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the required "
                  "convention ^Capacium v[0-9]+\\.[0-9]+\\.[0-9]+$ or its "
                  "prerelease form ...-rc[0-9]+$. Refusing before any release "
                  "object exists.\n" % name
              )
              sys.exit(2)
          sys.stdout.write("title gate: %r conforms\n" % name)
          TITLE_GATE_PY
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      # The body is the CHANGELOG entry for this version. A tag whose version
      # has no section — or an empty one — fails here, before any release
      # object exists. The extractor is committed and shared with the GitHub
      # release job; it is stdlib-only on purpose (no yaml, no pydantic).
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          NOTES="$(python3 scripts/extract_changelog_notes.py "$TAG_NAME")"
          {
            echo "notes<<NOTES_EOF"
            echo "${NOTES}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential. Pinned to the v3.4.2 tag.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/release_notes_audience_gate.py" \
            -o "$RUNNER_TEMP/release_notes_audience_gate.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/release_notes_audience_gate.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/release_notes_audience_gate.py"; exit 1; }

      # The release body is addressed at an external reader. The engine
      # classifies nothing by shape: the code-and-number form is shared by
      # internal ticket ids and by identifiers a reader legitimately needs
      # (CVE, RFC, ISO, UTF-8, SHA-256). It refuses a ticket-shaped token only
      # when its prefix appears in the vocabulary THIS repository declares.
      # That vocabulary is the committed .ops.yaml, not a shell literal, so a
      # reviewer can see and change the list.
      - name: Gate the release notes for an external audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 - "$PREFIXES_FILE" <<'PREFIXES_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          prefixes = []
          ops = Path(".ops.yaml")
          if not ops.is_file():
              sys.stderr.write(
                  "MissingTrackerPrefixesError: no .ops.yaml at the repository "
                  "root; the external-audience gate needs this repository's "
                  "declared tracker prefixes. Refusing rather than releasing "
                  "without the vocabulary the organisation chose.\n"
              )
              sys.exit(2)
          for raw in ops.read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line.startswith("tracker_prefixes:"):
                  continue
              value = line[len("tracker_prefixes:"):].strip()
              if value.startswith("[") and value.endswith("]"):
                  value = value[1:-1]
              for item in value.split(","):
                  item = item.strip().strip("'\"")
                  if item:
                      prefixes.append(item)
          if not prefixes:
              sys.stderr.write(
                  "MissingTrackerPrefixesError: .ops.yaml declares no "
                  "tracker_prefixes; refusing to run the audience gate with no "
                  "vocabulary.\n"
              )
              sys.exit(2)
          Path(out).write_text("\n".join(prefixes) + "\n", encoding="utf-8")
          PREFIXES_PY
          python3 "$RUNNER_TEMP/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

      - name: Create or re-assert the Forgejo release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
          RELEASE_NAME: "${{ steps.title.outputs.release_name }}"
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$NOTES" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false}')

          echo "Creating release $TAG_NAME..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "Release created successfully."
            exit 0
          fi

          if [ "$HTTP_STATUS" = "409" ] || [ "$HTTP_STATUS" = "422" ]; then
            # The release already exists. Forgejo has no `gh release edit`;
            # PATCH by tag. Both the canonical title AND the extracted notes are
            # written: repairing only the title is what left a stale body in
            # place after a re-run.
            echo "Release already exists (HTTP $HTTP_STATUS). Re-asserting canonical title and notes."
            PATCH_PAYLOAD=$(jq -n \
              --arg name "$RELEASE_NAME" \
              --arg body "$NOTES" \
              '{name: $name, body: $body}')
            PATCH_STATUS=$(curl -s -o patch.json -w "%{http_code}" \
              -X PATCH "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PATCH_PAYLOAD")
            if [ "$PATCH_STATUS" != "200" ]; then
              echo "Failed to re-assert release title and notes. HTTP $PATCH_STATUS"
              cat patch.json
              exit 1
            fi
            echo "Release title and notes re-asserted to '${RELEASE_NAME}'."
            exit 0
          fi

          echo "Failed to create release. HTTP $HTTP_STATUS"
          cat response.json
          exit 1
