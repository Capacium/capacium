name: Create Forgejo Release

# The release body is the CHANGELOG entry for the tag being released, never a
# commit-log dump. This workflow:
#
#   1. gates the release title (exactly "Capacium vX.Y.Z"),
#   2. extracts the notes from that tag's CHANGELOG.md section, and refuses the
#      release before any release object exists if the section is missing or
#      empty — a release with no authored notes is a release nobody can read,
#   3. runs the ops-engine external-audience gate, so a body that still names
#      this repository's own tracker is refused before publication,
#   4. creates the release with the canonical title and the extracted notes, or
#      — when it already exists — PATCHes BOTH the title and the body, so the
#      idempotent path cannot repair a title while leaving a stale body.
#
# The extraction is one implementation shared with the GitHub release job
# (scripts/extract_changelog_notes.py), not a second, drifting copy.
#
# The dry-run path (workflow_dispatch with dry_run: true) runs the same gates
# bracketed by before/after listings of all six publication surfaces and writes
# the report through scripts/dry_run_report.py, the single writer shared with
# scripts/release.sh --dry-run. Qualified digest comparison is out of scope
# here and belongs to RELMODEL-007.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Run gates with before/after listings but create nothing"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Dry-run before listing ──────────────────────────────────
      # The before snapshot is taken before any gate runs. A listing
      # query that fails (non-2xx, timeout, TLS error, missing token)
      # exits non-zero with a named error and is never stored as a
      # report value.
      - name: Dry-run before snapshot
        id: dry_run_before
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL:-https://code.langevc.com/api/v1}"
          REPO="${GITHUB_REPOSITORY:-capacium/capacium}"

          # tags: git ls-remote (no auth needed)
          tags="$(git ls-remote --tags origin 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote --tags origin failed"
            exit 2
          }

          # releases: Forgejo API (needs token)
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ListingError: GITHUB_TOKEN is not set — cannot list releases"
            exit 2
          fi
          releases="$(curl -sSf -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases?per_page=100" | \
            jq -c '[.[] | {id, tag_name, name, draft, prerelease}]')" || {
            echo "ListingError: Forgejo releases API query failed"
            exit 2
          }

          # mirror refs: git ls-remote GitHub mirror
          mirror_refs="$(git ls-remote https://github.com/Capacium/capacium.git 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote GitHub mirror failed"
            exit 2
          }

          # PyPI: JSON API is public, no token required
          pypi="$(curl -sSf "https://pypi.org/pypi/capacium/json" | \
            jq -c '{releases: (.releases | keys | sort)}')" || {
            echo "ListingError: PyPI API query failed"
            exit 2
          }

          # GHCR: anonymous pull token then tags/list
          ghcr_token_url="https://ghcr.io/token?scope=repository:capacium/cap:pull&service=ghcr.io"
          GHCR_BEARER="$(curl -sSf "$ghcr_token_url" | jq -r '.token // empty')" || {
            echo "ListingError: GHCR anonymous token request failed"
            exit 2
          }
          ghcr="$(curl -sSf \
            -H "Authorization: Bearer ${GHCR_BEARER}" \
            "https://ghcr.io/v2/capacium/cap/tags/list" | jq -c .)" || {
            echo "ListingError: GHCR tags/list query failed"
            exit 2
          }

          # Tap: git ls-remote on the tap repo
          tap="$(git ls-remote https://github.com/Capacium/homebrew-tap.git 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote Homebrew tap failed"
            exit 2
          }

          BEFORE=$(jq -n -c \
            --argjson tags_arg "$(echo "$tags" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            --argjson releases_arg "$(echo "$releases" | jq -c .)" \
            --argjson mirror_refs_arg "$(echo "$mirror_refs" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            --argjson pypi_arg "$(echo "$pypi" | jq -c .)" \
            --argjson ghcr_arg "$(echo "$ghcr" | jq -c .)" \
            --argjson tap_arg "$(echo "$tap" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            '{tags: $tags_arg, releases: $releases_arg, mirror_refs: $mirror_refs_arg, pypi: $pypi_arg, ghcr: $ghcr_arg, tap: $tap_arg}')
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"

      # The release title is a gate, not an agreement. A tag whose rendered
      # title does not conform is refused here, before any release object
      # exists. Forge default behaviour names a release after the bare tag —
      # that is not the convention.
      - name: Gate the release title
        id: title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          RELEASE_NAME="Capacium ${TAG_NAME}"
          python3 - "${RELEASE_NAME}" <<'TITLE_GATE_PY'
          import re
          import sys

          NAME_RE = re.compile(
              r"^Capacium v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?$"
          )
          name = sys.argv[1]
          if not NAME_RE.match(name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the required "
                  "convention ^Capacium v[0-9]+\\.[0-9]+\\.[0-9]+$ or its "
                  "prerelease form ...-rc[0-9]+$. Refusing before any release "
                  "object exists.\n" % name
              )
              sys.exit(2)
          sys.stdout.write("title gate: %r conforms\n" % name)
          TITLE_GATE_PY
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "title_gate=passed" >> "$GITHUB_OUTPUT"

      # The body is the CHANGELOG entry for this version. A tag whose version
      # has no section — or an empty one — fails here, before any release
      # object exists. The extractor is committed and shared with the GitHub
      # release job; it is stdlib-only on purpose (no yaml, no pydantic).
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          NOTES="$(python3 scripts/extract_changelog_notes.py "$TAG_NAME")"
          {
            echo "notes<<NOTES_EOF"
            echo "${NOTES}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "notes_gate=passed" >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential. Pinned to the v3.4.2 tag.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/release_notes_audience_gate.py" \
            -o "$RUNNER_TEMP/release_notes_audience_gate.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/release_notes_audience_gate.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/release_notes_audience_gate.py"; exit 1; }

      # The release body is addressed at an external reader. The engine
      # classifies nothing by shape: the code-and-number form is shared by
      # internal ticket ids and by identifiers a reader legitimately needs
      # (CVE, RFC, ISO, UTF-8, SHA-256). It refuses a ticket-shaped token only
      # when its prefix appears in the vocabulary THIS repository declares.
      # That vocabulary is the committed .ops.yaml, not a shell literal, so a
      # reviewer can see and change the list.
      - name: Gate the release notes for an external audience
        id: audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 scripts/extract_tracker_prefixes.py > "$PREFIXES_FILE"
          python3 "$RUNNER_TEMP/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"
          echo "audience_gate=passed" >> "$GITHUB_OUTPUT"

      - name: Create or re-assert the Forgejo release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
          RELEASE_NAME: "${{ steps.title.outputs.release_name }}"
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$NOTES" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false}')

          echo "Creating release $TAG_NAME..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "Release created successfully."
            exit 0
          fi

          if [ "$HTTP_STATUS" = "409" ] || [ "$HTTP_STATUS" = "422" ]; then
            echo "Release already exists (HTTP $HTTP_STATUS). Re-asserting canonical title and notes."
            PATCH_PAYLOAD=$(jq -n \
              --arg name "$RELEASE_NAME" \
              --arg body "$NOTES" \
              '{name: $name, body: $body}')
            PATCH_STATUS=$(curl -s -o patch.json -w "%{http_code}" \
              -X PATCH "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PATCH_PAYLOAD")
            if [ "$PATCH_STATUS" != "200" ]; then
              echo "Failed to re-assert release title and notes. HTTP $PATCH_STATUS"
              cat patch.json
              exit 1
            fi
            echo "Release title and notes re-asserted to '${RELEASE_NAME}'."
            exit 0
          fi

          echo "Failed to create release. HTTP $HTTP_STATUS"
          cat response.json
          exit 1

      # ── Dry-run after listing ───────────────────────────────────
      # The after snapshot is taken after the gates ran, bracketing them
      # together with the before snapshot. A listing query that fails
      # exits non-zero — it is never stored as a report value.
      - name: Dry-run after snapshot
        id: dry_run_after
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL:-https://code.langevc.com/api/v1}"
          REPO="${GITHUB_REPOSITORY:-capacium/capacium}"

          tags="$(git ls-remote --tags origin 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote --tags origin failed"
            exit 2
          }

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ListingError: GITHUB_TOKEN is not set — cannot list releases"
            exit 2
          fi
          releases="$(curl -sSf -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases?per_page=100" | \
            jq -c '[.[] | {id, tag_name, name, draft, prerelease}]')" || {
            echo "ListingError: Forgejo releases API query failed"
            exit 2
          }

          mirror_refs="$(git ls-remote https://github.com/Capacium/capacium.git 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote GitHub mirror failed"
            exit 2
          }

          pypi="$(curl -sSf "https://pypi.org/pypi/capacium/json" | \
            jq -c '{releases: (.releases | keys | sort)}')" || {
            echo "ListingError: PyPI API query failed"
            exit 2
          }

          ghcr_token_url="https://ghcr.io/token?scope=repository:capacium/cap:pull&service=ghcr.io"
          GHCR_BEARER="$(curl -sSf "$ghcr_token_url" | jq -r '.token // empty')" || {
            echo "ListingError: GHCR anonymous token request failed"
            exit 2
          }
          ghcr="$(curl -sSf \
            -H "Authorization: Bearer ${GHCR_BEARER}" \
            "https://ghcr.io/v2/capacium/cap/tags/list" | jq -c .)" || {
            echo "ListingError: GHCR tags/list query failed"
            exit 2
          }

          tap="$(git ls-remote https://github.com/Capacium/homebrew-tap.git 2>/dev/null | awk '{print $2}' | sort)" || {
            echo "ListingError: git ls-remote Homebrew tap failed"
            exit 2
          }

          AFTER=$(jq -n -c \
            --argjson tags_arg "$(echo "$tags" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            --argjson releases_arg "$(echo "$releases" | jq -c .)" \
            --argjson mirror_refs_arg "$(echo "$mirror_refs" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            --argjson pypi_arg "$(echo "$pypi" | jq -c .)" \
            --argjson ghcr_arg "$(echo "$ghcr" | jq -c .)" \
            --argjson tap_arg "$(echo "$tap" | jq -R -s 'split("\n") | map(select(. != ""))')" \
            '{tags: $tags_arg, releases: $releases_arg, mirror_refs: $mirror_refs_arg, pypi: $pypi_arg, ghcr: $ghcr_arg, tap: $tap_arg}')
          echo "after=${AFTER}" >> "$GITHUB_OUTPUT"

      # ── Dry-run report: single writer shared with release.sh ─────
      - name: Dry-run write report
        id: dry_run_report
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name }}"
          RELEASE_NAME: "${{ steps.title.outputs.release_name }}"
          TITLE_GATE: "${{ steps.title.outputs.title_gate }}"
          NOTES_GATE: "${{ steps.notes.outputs.notes_gate }}"
          AUDIENCE_GATE: "${{ steps.audience.outputs.audience_gate }}"
          BEFORE: "${{ steps.dry_run_before.outputs.before }}"
          AFTER: "${{ steps.dry_run_after.outputs.after }}"
        run: |
          set -euo pipefail
          echo "=== Dry-run report ==="
          python3 scripts/dry_run_report.py \
            --tag "$TAG_NAME" \
            --release-name "$RELEASE_NAME" \
            --title-gate "${TITLE_GATE:-not run}" \
            --notes-gate "${NOTES_GATE:-not run}" \
            --audience-gate "${AUDIENCE_GATE:-not run}" \
            --before "$BEFORE" \
            --after "$AFTER" \
            --output dry-run-report.json

          # Check: a gate recorded as 'not run' means a step failed to
          # produce its output, which must be refused.
          echo "report=$(jq -c . dry-run-report.json)" >> "$GITHUB_OUTPUT"
          for gate in title notes audience; do
            VAL="$(jq -r ".gates.${gate}" dry-run-report.json)"
            if [ "$VAL" = "not run" ]; then
              echo "GateRefusalError: ${gate} gate recorded as 'not run' — refusing dry-run"
              exit 2
            fi
          done

      - name: Dry-run upload report artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: dry-run-report.json
          retention-days: 30
