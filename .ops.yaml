# Release configuration for Capacium Core.
#
# tracker_prefixes are THIS repository's own tracker prefixes, used by the
# external-audience gate (.forgejo/workflows/forgejo-release.yml) to refuse a
# release body that still names the author's tracker. A ticket-shaped token is
# refused only when its prefix appears here; the gate classifies nothing by
# shape alone, because the same code-and-number form is shared by identifiers a
# reader legitimately needs (CVE, RFC, ISO, UTF-8, SHA-256).
#
# The list is committed rather than passed as a shell literal so a reviewer can
# see and change it: it was derived from the prefixes that actually occur in
# this repository's commit subjects and changelog. Add a prefix here when a new
# tracker namespace starts being used.
tracker_prefixes:
  - CAP
  - EX
  - QA
  - STAB
  - UP
  - VER
  - BUG
  - TEST
  - OPS
  - FIX
  - FEAT
  - CL
  - CI
  - CIP
  - ADR
  - SW

# Layer-3 release destinations. The ops-engine release path reads them from the
# pushed tag and refuses the tag with MissingReleaseDestinationsError when no
# destination carries the role `release` (measured at v1.1.10, 2026-11-18).
# The forge is a value, not a key name. Visibilities are the measured state of
# each forge on 2026-11-18: the canonical Forgejo repository capacium/capacium
# is private, the GitHub mirror Capacium/capacium is public.
destinations:
  - forge: forgejo
    repo: capacium/capacium
    role: release
    visibility: private
    credential_variable: FORGEJO_TOKEN
  - forge: github
    repo: Capacium/capacium
    role: release
    visibility: public
    credential_variable: GH_MIRROR_TOKEN

# Layer-3 release manifest (REA-016, decision D2). Each piece names the forge
# that builds it and the destinations that must hold it. Every binary here is
# built by GitHub (D4: the standalone binaries and the Python distributions are
# built by GitHub Actions, which the self-hosted Forgejo has no macOS or Windows
# runners for), so a piece that is still on its way is pending inside the
# deadline and red only after it, never red at once.
#
# The two types the manifest accepts are release-object assets,
# `github_release_tarball` and `github_release_zip`; the file extension is not
# part of the type, so the wheel and checksums.txt are declared as tarballs by
# the same reading. The .deb and .rpm packages are built by nfpm in binaries.yml
# and attached to the same release, but they have no release-object type in
# `release.manifest.assets`: they are built and attached, not declared here,
# and they are NOT mirrored to Forgejo (owner decision): only the six pieces
# declared below cross to the Forgejo release; the .deb and .rpm stay on GitHub.
#
# Every piece now names BOTH destinations, so the Forgejo release must hold it
# too. `release.forgejo_assets: pull` (REA-017) arms the pull that downloads
# each GitHub-built piece and attaches it to the Forgejo release, verifying its
# SHA-256 against GitHub's digest before uploading. The same six names are
# declared again under `release.assets` (REA-010) because that is the key the
# release census reads; a manifest the census does not read would leave the
# Forgejo release unaccounted for.
release:
  enabled: true
  forgejo_assets: pull
  # The census declaration (REA-010). `<version>` expands to the tag without
  # its leading `v`. Kept equal to the six `release.manifest.assets` pieces.
  assets:
    - type: github_release_tarball
      name: cap-Linux-X64.tar.gz
    - type: github_release_tarball
      name: cap-macOS-ARM64.tar.gz
    - type: github_release_zip
      name: cap-Windows-X64.zip
    - type: github_release_tarball
      name: capacium-<version>-py3-none-any.whl
    - type: github_release_tarball
      name: capacium-<version>.tar.gz
    - type: github_release_tarball
      name: checksums.txt
  manifest:
    deadline_minutes: 60
    assets:
      - type: github_release_tarball
        name: cap-Linux-X64.tar.gz
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
      - type: github_release_tarball
        name: cap-macOS-ARM64.tar.gz
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
      - type: github_release_zip
        name: cap-Windows-X64.zip
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
      - type: github_release_tarball
        name: capacium-<version>-py3-none-any.whl
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
      - type: github_release_tarball
        name: capacium-<version>.tar.gz
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
      - type: github_release_tarball
        name: checksums.txt
        producer: github
        destinations: ["github:Capacium/capacium", "forgejo:capacium/capacium"]
    channels:
      - channel: pypi
        name: capacium
        producer: github
      - channel: ghcr
        name: capacium/cap
        producer: github
      - channel: homebrew
        name: Capacium/homebrew-tap
        producer: github
